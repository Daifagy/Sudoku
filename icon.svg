<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Yuvarlatılmış Arka Plan Arka Gradiyenti -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e232a"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>
    
    <!-- Hücre İç Vurgu Gradiyenti -->
    <linearGradient id="selectedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3182ce"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </linearGradient>

    <!-- Gölge Efekti -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Uygulama İkon Çerçevesi (Squircle) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- 3x3 Izgara Konteyneri -->
  <g filter="url(#dropShadow)" transform="translate(66, 66)">
    <!-- Dış Çerçeve ve Izgara Arka Planı -->
    <rect width="380" height="380" rx="24" fill="#2d3748" stroke="#4a5568" stroke-width="6"/>

    <!-- KUTU 1 (Sol Üst) - Sayı: 5 -->
    <rect x="16" y="16" width="108" height="108" rx="14" fill="#1a1d24"/>
    <text x="70" y="88" font-family="-apple-system, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

    <!-- KUTU 2 (Orta Üst) - Sayı: 3 -->
    <rect x="136" y="16" width="108" height="108" rx="14" fill="#1a1d24"/>
    <text x="190" y="88" font-family="-apple-system, sans-serif" font-size="64" font-weight="bold" fill="#63b3ed" text-anchor="middle">3</text>

    <!-- KUTU 3 (Sağ Üst) - Boş/Vurgulu -->
    <rect x="256" y="16" width="108" height="108" rx="14" fill="#1a1d24"/>

    <!-- KUTU 4 (Sol Orta) - Sayı: 6 -->
    <rect x="16" y="136" width="108" height="108" rx="14" fill="#1a1d24"/>
    <text x="70" y="208" font-family="-apple-system, sans-serif" font-size="64" font-weight="bold" fill="#63b3ed" text-anchor="middle">6</text>

    <!-- KUTU 5 (TAM ORTA - Seçili Hücre) - Sayı: 9 -->
    <rect x="136" y="136" width="108" height="108" rx="14" fill="url(#selectedGrad)"/>
    <text x="190" y="208" font-family="-apple-system, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>

    <!-- KUTU 6 (Sağ Orta) - Sayı: 1 -->
    <rect x="256" y="136" width="108" height="108" rx="14" fill="#1a1d24"/>
    <text x="310" y="208" font-family="-apple-system, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

    <!-- KUTU 7 (Sol Alt) - Boş -->
    <rect x="16" y="256" width="108" height="108" rx="14" fill="#1a1d24"/>

    <!-- KUTU 8 (Orta Alt) - Sayı: 8 -->
    <rect x="136" y="256" width="108" height="108" rx="14" fill="#1a1d24"/>
    <text x="190" y="328" font-family="-apple-system, sans-serif" font-size="64" font-weight="bold" fill="#63b3ed" text-anchor="middle">8</text>

    <!-- KUTU 9 (Sağ Alt - Tamamlanmış Rakam Vurgusu) - Sayı: 4 -->
    <rect x="256" y="256" width="108" height="108" rx="14" fill="#ffe082"/>
    <text x="310" y="328" font-family="-apple-system, sans-serif" font-size="64" font-weight="bold" fill="#1a202c" text-anchor="middle">4</text>
  </g>
</svg>
