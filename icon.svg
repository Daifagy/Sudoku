<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Arka Plan Kutusu -->
  <rect width="512" height="512" rx="100" fill="#121418"/>
  
  <!-- 3x3 Sudoku Izgara Çerçevesi -->
  <rect x="66" y="66" width="380" height="380" rx="20" fill="#2d3748"/>

  <!-- Satır 1 -->
  <rect x="82" y="82" width="104" height="104" rx="12" fill="#1a1d24"/>
  <text x="134" y="156" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

  <rect x="204" y="82" width="104" height="104" rx="12" fill="#1a1d24"/>
  <text x="256" y="156" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#63b3ed" text-anchor="middle">3</text>

  <rect x="326" y="82" width="104" height="104" rx="12" fill="#1a1d24"/>

  <!-- Satır 2 -->
  <rect x="82" y="204" width="104" height="104" rx="12" fill="#1a1d24"/>
  <text x="134" y="278" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#63b3ed" text-anchor="middle">6</text>

  <!-- Tam Orta (Seçili Mavi Hücre) -->
  <rect x="204" y="204" width="104" height="104" rx="12" fill="#3182ce"/>
  <text x="256" y="278" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>

  <rect x="326" y="204" width="104" height="104" rx="12" fill="#1a1d24"/>
  <text x="378" y="278" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Satır 3 -->
  <rect x="82" y="326" width="104" height="104" rx="12" fill="#1a1d24"/>

  <rect x="204" y="326" width="104" height="104" rx="12" fill="#1a1d24"/>
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#63b3ed" text-anchor="middle">8</text>

  <!-- Sağ Alt (Tamamlanan Sarı Hücre) -->
  <rect x="326" y="326" width="104" height="104" rx="12" fill="#ffe082"/>
  <text x="378" y="400" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#1a202c" text-anchor="middle">4</text>
</svg>
